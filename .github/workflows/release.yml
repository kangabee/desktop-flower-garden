# v로 시작하는 태그(예: v0.2.0)를 올리면 Mac·Windows 설치 파일을 만들어 GitHub Releases 에 첨부한다.
#   git tag v0.2.0 && git push origin v0.2.0
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: --mac
            files: release/*.dmg
          - os: windows-latest
            target: --win
            files: release/*.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 앱 안의 "선물 링크"가 이 저장소의 GitHub Pages 카드 페이지를 가리키게
      # (비공개 저장소는 Pages 가 없으므로 링크 기능을 끈 채로 빌드)
      - name: Share URLs from this repository
        if: ${{ !github.event.repository.private }}
        shell: bash
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "VITE_SHARE_BASE_URL=https://$OWNER.github.io/${{ github.event.repository.name }}/card.html" >> "$GITHUB_ENV"
          echo "VITE_DOWNLOAD_URL=https://$OWNER.github.io/${{ github.event.repository.name }}/" >> "$GITHUB_ENV"
      - run: npm run build
      - run: npx electron-builder ${{ matrix.target }} --publish never
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
